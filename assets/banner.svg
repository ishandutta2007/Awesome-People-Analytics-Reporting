<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.75" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blur-large" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Animation Keyframes -->
    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(0.5deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-0.5deg); }
      }
      @keyframes float3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashAnim {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarPing {
        0% { r: 4px; opacity: 1; }
        100% { r: 35px; opacity: 0; }
      }
      .card-float-1 { animation: float1 7s ease-in-out infinite; transform-origin: center; }
      .card-float-2 { animation: float2 9s ease-in-out infinite; transform-origin: center; }
      .card-float-3 { animation: float3 6s ease-in-out infinite; transform-origin: center; }
      .glow-orb-1 { animation: pulseBeam 8s ease-in-out infinite; transform-origin: 200px 100px; }
      .glow-orb-2 { animation: pulseBeam 10s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
      .chart-line { stroke-dasharray: 1200; animation: dashAnim 4s ease-out forwards; }
      .ping-circle { animation: radarPing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
      .ping-circle-delay { animation: radarPing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.25s; }
      
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        fill: #FFFFFF;
        letter-spacing: -0.5px;
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        fill: #94A3B8;
      }
      .text-badge {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        fill: #38BDF8;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Background Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- 2. Ambient Blurred Glowing Orbs (Dynamic Pulse) -->
  <circle class="glow-orb-1" cx="220" cy="120" r="160" fill="url(#primary-glow)" filter="url(#blur-large)" />
  <circle class="glow-orb-2" cx="1020" cy="280" r="180" fill="url(#cyan-glow)" filter="url(#blur-large)" />

  <!-- 3. Animated Analytics Chart Line & Area (Bottom Accent) -->
  <g opacity="0.85">
    <!-- Chart Gradient Fill Underneath -->
    <path d="M 0 380 Q 250 350, 480 320 T 820 230 T 1200 170 L 1200 420 L 0 420 Z" fill="url(#cyan-glow)" opacity="0.12" />
    <!-- Dynamic Animated Trend Line -->
    <path class="chart-line" d="M 0 380 Q 250 350, 480 320 T 820 230 T 1200 170" fill="none" stroke="url(#line-grad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Glowing Chart Data Points -->
    <circle cx="480" cy="320" r="4" fill="#06B6D4" />
    <circle cx="820" cy="230" r="4" fill="#818CF8" />
    <circle cx="1120" cy="180" r="5" fill="#F43F5E" />
    <circle class="ping-circle" cx="1120" cy="180" r="4" stroke="#F43F5E" stroke-width="1.5" fill="none" />
    <circle class="ping-circle-delay" cx="1120" cy="180" r="4" stroke="#F43F5E" stroke-width="1.5" fill="none" />
  </g>

  <!-- 4. Dynamic Right-Side Floating Glassmorphism Metric Cards (Carefully positioned to NEVER overlap text) -->
  <g class="card-float-1" filter="url(#drop-shadow)">
    <rect x="840" y="55" width="310" height="74" rx="12" fill="url(#card-grad)" stroke="#475569" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="875" cy="92" r="18" fill="#10B981" fill-opacity="0.15" />
    <path d="M 868 95 L 873 90 L 877 94 L 883 87" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="904" y="85" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.5">RETENTION RATE</text>
    <text x="904" y="107" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">94.8% <tspan font-size="12" fill="#10B981" font-weight="600">+4.2% YoY</tspan></text>
  </g>

  <g class="card-float-2" filter="url(#drop-shadow)">
    <rect x="800" y="150" width="350" height="74" rx="12" fill="url(#card-grad)" stroke="#475569" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="835" cy="187" r="18" fill="#6366F1" fill-opacity="0.15" />
    <circle cx="835" cy="187" r="8" fill="none" stroke="#6366F1" stroke-width="2" />
    <circle cx="835" cy="187" r="3" fill="#818CF8" />
    <text x="864" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.5">AI FLIGHT-RISK MODEL</text>
    <text x="864" y="202" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">92.4% Accuracy <tspan font-size="12" fill="#818CF8" font-weight="600">Active</tspan></text>
  </g>

  <g class="card-float-3" filter="url(#drop-shadow)">
    <rect x="850" y="245" width="300" height="74" rx="12" fill="url(#card-grad)" stroke="#475569" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="885" cy="282" r="18" fill="#F59E0B" fill-opacity="0.15" />
    <path d="M 878 288 L 885 275 L 892 288 Z" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round" />
    <text x="914" y="275" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.5">WORKFORCE ECOSYSTEM</text>
    <text x="914" y="297" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">SaaS &amp; Open Source</text>
  </g>

  <!-- 5. Foreground Content (Highest Z-Order: Crystal Clear, Zero Overlap) -->
  <g transform="translate(64, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 68)">
      <rect width="260" height="30" rx="15" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="15" r="4" fill="#38BDF8" />
      <text x="28" y="20" class="text-badge">PEOPLE ANALYTICS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" class="text-title" font-size="40">Awesome People Analytics</text>
    <text x="0" y="202" class="text-title" font-size="40">&amp; HR Reporting</text>

    <!-- Subtitle -->
    <text x="0" y="248" class="text-subtitle" font-size="16">
      Curated directory of SaaS intelligence suites, open-source models,
    </text>
    <text x="0" y="274" class="text-subtitle" font-size="16">
      workforce planning engines, attrition algorithms &amp; HR dashboards.
    </text>

    <!-- Key Feature Tag Pills -->
    <g transform="translate(0, 316)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="138" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#E2E8F0" font-weight="500">🏢 SaaS Platforms</text>
      <!-- Pill 2 -->
      <rect x="148" y="0" width="156" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="162" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#E2E8F0" font-weight="500">🔓 Open-Source Repos</text>
      <!-- Pill 3 -->
      <rect x="314" y="0" width="160" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="328" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#E2E8F0" font-weight="500">📉 Attrition &amp; Retention</text>
      <!-- Pill 4 -->
      <rect x="484" y="0" width="150" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="498" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#E2E8F0" font-weight="500">👥 Org Design &amp; ONA</text>
    </g>
  </g>
</svg>
